AWSTemplateFormatVersion: '2010-09-09'
Description: Path A baseline - API Gateway HTTP API + Arm64 Node.js Lambda Event Function

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  RuntimeName:
    Type: String
    Default: nodejs24.x

Resources:
  ValidateFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ValidateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cb-speedrun-apigw-fn
      Runtime: !Ref RuntimeName
      Architectures:
        - arm64
      Handler: index.handler
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ValidateFunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: cb-speedrun-http-api
      ProtocolType: HTTP

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ValidateFunction.Arn
      PayloadFormatVersion: '2.0'

  ValidateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /validate
      AuthorizationType: AWS_IAM
      Target: !Sub integrations/${LambdaIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  AllowApiGatewayInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ValidateFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/validate

Outputs:
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  FunctionName:
    Value: !Ref ValidateFunction
